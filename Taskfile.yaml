# https://taskfile.dev

version: "3"

dotenv:
  - ".env"

env:
  DOCKER_BUILDKIT: '1'

vars:
  VERSION:
    sh: sed -n 's/^pub const VERSION_STRING: &str = "\\(.*\\)";/\\1/p' crates/quil-config/src/version.rs
  GIT_REPO:
    sh: git config --get remote.origin.url | sed 's/\\.git$//'
  GIT_BRANCH:
    sh: git rev-parse --abbrev-ref HEAD
  GIT_COMMIT:
    sh: git log -1 --format=%h

tasks:
  status:
    desc: Display qclient build configuration.
    cmds:
      - echo -n "Version:" && echo " {{.VERSION}}"
      - echo -n "Repo   :" && echo " {{.GIT_REPO}}"
      - echo -n "Branch :" && echo " {{.GIT_BRANCH}}"
      - echo -n "Commit :" && echo " {{.GIT_COMMIT}}"
    silent: true

  build_qclient_arm64_macos:
    desc: Build the Rust qclient for macOS ARM64. Outputs to crates/quil-client/build.
    cmds:
      - mkdir -p crates/quil-client/build/arm64_macos
      - cargo build --release -p quil-client --bin qclient
      - install -m 0755 target/release/qclient crates/quil-client/build/arm64_macos/qclient

  build_qclient_arm64_linux:
    desc: Build the Rust qclient for Linux ARM64. Outputs to crates/quil-client/build.
    cmds:
      - docker build --ulimit stack=-1:-1 --platform linux/arm64 -f docker/Dockerfile.source --output crates/quil-client/build/arm64_linux --target=qclient .

  build_qclient_amd64_linux:
    desc: Build the Rust qclient for Linux AMD64. Outputs to crates/quil-client/build.
    cmds:
      - docker build --ulimit stack=-1:-1 --platform linux/amd64 -f docker/Dockerfile.source --output crates/quil-client/build/amd64_linux --target=qclient .

  test:qclient:
    desc: Run Rust qclient tests.
    cmds:
      - cargo test -p quil-client
